<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- #region cabecera -->
  <title>Empleado · Empleados</title>
  <script src="ez-ui/js/theme-init.js"></script>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="ez-ui/css/ez-ui.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/libs/axios.min.js"></script>
  <script src="js/employee-detail.js" type="module"></script>
  <!-- #endregion -->
</head>
<body>
  <!-- #region navbar -->
  <nav class="ez-navbar" aria-label="Principal">
    <div class="ez-container ez-navbar__inner">
      <a class="ez-navbar__brand" href="index.html">Gestión de empleados</a>
      <button class="ez-button ez-button--secondary ez-navbar__toggle" type="button"
              aria-expanded="false" aria-controls="navbar-links">Menú</button>
      <ul id="navbar-links" class="ez-navbar__links">
        <li><a href="index.html">Empleados</a></li>
        <li id="navbar-new"><a href="employee-form.html">Nuevo empleado</a></li>
        <li id="navbar-session"></li>
        <li>
          <button class="ez-button ez-button--secondary ez-theme-toggle" type="button"
                  aria-label="Cambiar de tema" title="Cambiar de tema">
            <span class="ez-theme-toggle__to-dark">Oscuro</span>
            <span class="ez-theme-toggle__to-light">Claro</span>
          </button>
        </li>
      </ul>
    </div>
  </nav>
  <!-- #endregion -->

  <main class="ez-container">
    <!-- #region ficha -->
    <h1 id="employee-name"></h1>
    <!-- ez-split: la ficha y, al lado, los empleados a su cargo (en una pantalla estrecha, debajo) -->
    <div class="ez-split">
      <div id="employee-details"></div>
      <div id="team"></div>
    </div>
    <!-- #endregion -->

    <!-- #region dialogos -->
    <dialog id="end-contract-dialog" class="ez-dialog" aria-labelledby="end-contract-dialog-title">
      <h3 id="end-contract-dialog-title">¿Dar de baja al empleado?</h3>
      <p>Su contrato terminará hoy.</p>
      <form method="dialog" class="ez-dialog__actions">
        <button class="ez-button ez-button--secondary" type="submit" value="cancel">Cancelar</button>
        <button class="ez-button" type="submit" value="confirm">Dar de baja</button>
      </form>
    </dialog>

    <dialog id="delete-dialog" class="ez-dialog" aria-labelledby="delete-dialog-title">
      <h3 id="delete-dialog-title">¿Borrar el empleado?</h3>
      <p>El empleado se borrará de la base de datos.</p>
      <form method="dialog" class="ez-dialog__actions">
        <button class="ez-button ez-button--secondary" type="submit" value="cancel">Cancelar</button>
        <button class="ez-button ez-button--danger" type="submit" value="confirm">Borrar</button>
      </form>
    </dialog>
    <!-- #endregion -->
  </main>
</body>
</html>
