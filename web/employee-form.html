<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- #region cabecera -->
  <title>Nuevo empleado · Empleados</title>
  <script src="ez-ui/js/theme-init.js"></script>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="ez-ui/css/ez-ui.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/libs/axios.min.js"></script>
  <script src="js/employee-form.js" type="module"></script>
  <!-- #endregion -->
</head>
<body>
  <!-- #region navbar -->
  <nav class="ez-navbar" aria-label="Principal">
    <div class="ez-container ez-navbar__inner">
      <a class="ez-navbar__brand" href="index.html">Gestión de empleados</a>
      <button class="ez-button ez-button--secondary ez-navbar__toggle" type="button"
              aria-expanded="false" aria-controls="navbar-links">Menú</button>
      <ul id="navbar-links" class="ez-navbar__links">
        <li><a href="index.html">Empleados</a></li>
        <li><a href="employee-form.html" aria-current="page">Nuevo empleado</a></li>
        <li>
          <button class="ez-button ez-button--secondary ez-theme-toggle" type="button"
                  aria-label="Cambiar de tema" title="Cambiar de tema">
            <span class="ez-theme-toggle__to-dark">Oscuro</span>
            <span class="ez-theme-toggle__to-light">Claro</span>
          </button>
        </li>
      </ul>
    </div>
  </nav>
  <!-- #endregion -->

  <main class="ez-container">
    <h1>Nuevo empleado</h1>

    <!-- #region formulario -->
    <form>
      <div class="ez-field">
        <label for="name_emp">Nombre</label>
        <input type="text" id="name_emp" name="name_emp" maxlength="64" required>
        <span class="ez-field__hint">No puede repetirse (RN01).</span>
      </div>
      <div class="ez-field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" maxlength="255" required>
      </div>
      <div class="ez-field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="ez-field">
        <label for="position">Puesto</label>
        <select id="position" name="position">
          <option value="Programmer">Programmer</option>
          <option value="Manager">Manager</option>
          <option value="CEO">CEO</option>
        </select>
      </div>
      <div class="ez-field">
        <label for="department_id">Departamento</label>
        <select id="department_id" name="department_id">
          <option value="">Sin departamento</option>
          <option value="1">Arte (Cádiz)</option>
          <option value="2">Historia</option>
          <option value="3">Informática (Sevilla)</option>
        </select>
      </div>
      <div class="ez-field">
        <label for="boss_id">Jefe</label>
        <select id="boss_id" name="boss_id">
          <option value="">Sin jefe</option>
          <option value="1">Pedro</option>
          <option value="2">Jose</option>
          <option value="3">Lola</option>
        </select>
      </div>
      <div class="ez-field">
        <label for="salary">Salario (€)</label>
        <input type="number" id="salary" name="salary" min="0.01" step="0.01" value="2000" required>
      </div>
      <div class="ez-field">
        <label for="fee">Comisión</label>
        <input type="number" id="fee" name="fee" min="0" max="1" step="0.05" value="0" required>
        <span class="ez-field__hint">Un porcentaje del salario, de 0 a 1 (RN05).</span>
      </div>
      <div class="ez-field">
        <label for="start_date">Fecha de inicio</label>
        <input type="date" id="start_date" name="start_date" required>
      </div>
      <button class="ez-button" type="submit">Guardar</button>
    </form>
    <!-- #endregion -->
  </main>
</body>
</html>
